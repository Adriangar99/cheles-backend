# Project name "cheles": reuses the existing db-data volume and is shared with cheles-frontend
name: cheles

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheles
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: cheles
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheles"]
      interval: 5s
      retries: 10
    networks: [internal]

  api:
    build: .
    image: cheles-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://cheles:${DB_PASSWORD}@db:5432/cheles
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      EB_APPLICATION_ID: ${EB_APPLICATION_ID:-}
      EB_COUNTRY: ${EB_COUNTRY:-ES}
      TZ: Europe/Madrid
    secrets:
      - eb_private_key
    # No published ports: only the web app (cheles-frontend repo) reaches the API, over cheles-net
    networks:
      internal:
      web:
        aliases: [api]

secrets:
  eb_private_key:
    file: ./secrets/eb_private_key.pem

volumes:
  db-data:

networks:
  # The database is not visible from the web app
  internal:
  # Network shared with cheles-frontend; created by this compose file
  web:
    name: cheles-net

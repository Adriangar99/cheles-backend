schema: spec-driven

context: |
  Cheles: personal web app to view the user's own bank accounts (BBVA, Revolut…) through
  Enable Banking. Single user, only reachable from their Mac.
  This repo is the backend only: FastAPI + Postgres, Docker Compose. The frontend lives in the
  cheles-frontend repo; the API is only shared with it over the Docker network `cheles-net`.

  Language:
  - Write every artifact (proposal, specs, design, tasks), all documentation and all code
    (identifiers, comments, docstrings, commit messages) in English.
  - The app's user-facing copy is Spanish (Spain). Quote current user-facing literals verbatim.

  Constraints that cannot be inferred from the code:
  - Security: the web app only listens on 127.0.0.1, the API is never published, session via
    HttpOnly cookie, login with password + TOTP and a per-IP attempt limit.
  - Never commit or print `.env` or `secrets/` (Enable Banking private keys).
  - Transactions are stored exactly as the bank returns them (`raw`) so they can be reprocessed
    without fetching again; categorization/stats changes must derive from `raw`.
  - Transfers between the user's own accounts (detected by IBAN) count as neither expense nor
    income. Account roles: main (day to day), savings, excluded.

  Architecture (DDD + hexagonal; every context migrated):
  - Bounded contexts under app/: identity, categorization, transactions, banking, stats. Each one has
    domain/ (pure: no FastAPI, SQLAlchemy, httpx…), application/ (use cases and ports),
    infrastructure/ (ORM rows + repositories, HTTP router, external adapters) and public.py
    (the only module other code may import).
  - Shared kernel app/shared/: Money (no sign semantics), YearMonth, typed ids, in-memory event bus.
    A value object only goes into the kernel if it means the same in every context; otherwise
    each context owns its own (e.g. Iban in banking vs CounterpartyIban in transactions).
  - Composition root app/bootstrap.py (Container + wire): binds adapters to use cases and adapts one
    context's ports to another's public API. app/main.py is the composition edge (startup, scheduled
    sync, flows orchestrated across contexts such as POST /api/rules).
  - Cross-context interaction: ports adapted in the composition root (queries and commands that must
    answer), or events on the bus published after commit (reactions that need not answer).
    Contexts never import each other's internals; enforced by import-linter with no exceptions.
  - Stats has no tables: it reads other contexts' published read models through its ports.
  - Translation of the Enable Banking format (from `raw`) lives in transactions (its own ACL);
    banking fetches raw transactions and hands them to transactions.
  - TDD: domain and use cases tested with in-memory adapters; HTTP characterization tests (one per spec
    scenario) against real Postgres (testcontainers); schema managed with Alembic migrations.
  - Tooling: uv + pyproject, ruff, mypy strict, pytest + coverage, import-linter.

rules:
  proposal:
    - Always state what is out of scope
    - Flag whether the change touches the security surface (auth, port exposure, secrets)
    - State which bounded context(s) the change affects
    - State which cross-context events are added or changed
  specs:
    - One capability per business concept, under its bounded context (e.g. banking/bank-sync)
    - Verifiable WHEN/THEN scenarios that translate directly into tests
  design:
    - Place every new entity, value object, port and adapter in its layer and bounded context
    - Justify why each value object lives in its context or in the shared kernel, based on its meaning
    - State whether an Alembic migration is needed
  tasks:
    - "Follow TDD: every behavior task starts by writing the failing test"
    - Include a verification task with `docker compose up -d --build`

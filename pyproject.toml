[project]
name = "cheles-backend"
version = "0.1.0"
description = "Cheles API: personal bank account viewer on top of Enable Banking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "apscheduler==3.11.0",
    "argon2-cffi==23.1.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "pyjwt[crypto]==2.10.1",
    "pyotp==2.9.0",
    "qrcode==8.0",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
    "time-machine>=2.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

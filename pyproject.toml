[project]
name = "cheles-backend"
version = "0.1.0"
description = "Cheles API: personal bank account viewer on top of Enable Banking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.14.0",
    "apscheduler==3.11.0",
    "argon2-cffi==23.1.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.3",
    "pydantic-settings==2.7.0",
    "pyjwt[crypto]==2.10.1",
    "pyotp==2.9.0",
    "qrcode==8.0",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
    "time-machine>=2.16",
    "types-qrcode>=8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as default arguments
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type information
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
# Ratchet: the measured coverage rounded down; raise it as coverage grows, never lower it
fail_under = 94
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Context layers depend only downwards"
type = "layers"
containers = ["app.identity", "app.categorization"]
layers = ["public", "infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Context domain and application layers are framework-free"
type = "forbidden"
source_modules = [
    "app.identity.domain",
    "app.identity.application",
    "app.categorization.domain",
    "app.categorization.application",
]
forbidden_modules = ["fastapi", "starlette", "pydantic", "sqlalchemy", "httpx", "argon2", "pyotp", "qrcode", "alembic"]

[[tool.importlinter.contracts]]
name = "Contexts do not depend on legacy modules"
type = "forbidden"
source_modules = ["app.identity", "app.categorization"]
forbidden_modules = ["app.main", "app.cli", "app.models", "app.sync", "app.stats", "app.categorize", "app.enablebanking"]

[[tool.importlinter.contracts]]
# app.bootstrap is the composition root and may wire context internals
name = "Legacy modules use contexts only through their public API"
type = "forbidden"
source_modules = ["app.main", "app.cli", "app.models", "app.sync", "app.stats", "app.categorize", "app.enablebanking"]
forbidden_modules = [
    "app.identity.domain",
    "app.identity.application",
    "app.identity.infrastructure",
    "app.categorization.domain",
    "app.categorization.application",
    "app.categorization.infrastructure",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Categorization uses identity only through its public API"
type = "forbidden"
source_modules = ["app.categorization"]
forbidden_modules = ["app.identity.domain", "app.identity.application", "app.identity.infrastructure"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Identity uses categorization only through its public API"
type = "forbidden"
source_modules = ["app.identity"]
forbidden_modules = ["app.categorization.domain", "app.categorization.application", "app.categorization.infrastructure"]
allow_indirect_imports = true
